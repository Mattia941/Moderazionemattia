name: NoMercyMC
version: 1.21.11
main: com.nomercymc.moderation.NoMercyMC
api-version: '1.21'
author: mattia
description: Sistema avanzato di moderazione NoMercyMC (LiteBans/AdvancedBan style).

permissions:
  nomercymc.staff:
    description: Permette di vedere le notifiche dello staff.
    default: op

commands:
  ban: { permission: nomercymc.ban }
  tempban: { permission: nomercymc.tempban }
  ipban: { permission: nomercymc.ipban }
  tempipban: { permission: nomercymc.tempipban }
  unban: { permission: nomercymc.unban }
  mute: { permission: nomercymc.mute }
  tempmute: { permission: nomercymc.tempmute }
  unmute: { permission: nomercymc.unmute }
  kick: { permission: nomercymc.kick }
  warn: { permission: nomercymc.warn }
  tempwarn: { permission: nomercymc.tempwarn }
  unwarn: { permission: nomercymc.unwarn }
  check: { permission: nomercymc.check }
  history: { permission: nomercymc.history }
  dupeip: { permission: nomercymc.dupeip }
  clearchat: { permission: nomercymc.clearchat }
  mutechat: { permission: nomercymc.mutechat }
