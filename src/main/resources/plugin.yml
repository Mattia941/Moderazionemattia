name: MythMCModeration
version: 1.21.1
main: com.mythmc.moderation.MythMCModeration
api-version: '1.21'
prefix: MythMC
commands:
  ban:
    description: Banna un giocatore
    permission: mythmc.ban
  tempban:
    description: Banna temporaneamente un giocatore
    permission: mythmc.tempban
  ipban:
    description: Banna un IP
    permission: mythmc.ipban
  tempipban:
    description: Banna temporaneamente un IP
    permission: mythmc.tempipban
  unban:
    description: Sbanna un giocatore
    permission: mythmc.unban
  mute:
    description: Muta un giocatore
    permission: mythmc.mute
  tempmute:
    description: Muta temporaneamente un giocatore
    permission: mythmc.tempmute
  unmute:
    description: Smuta un giocatore
    permission: mythmc.unmute
  warn:
    description: Ammonisci un giocatore
    permission: mythmc.warn
  kick:
    description: Caccia un giocatore
    permission: mythmc.kick
  clearchat:
    description: Pulisci la chat
    permission: mythmc.clearchat
  dupeip:
    description: Controlla IP duplicati
    permission: mythmc.dupeip
